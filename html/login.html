<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Pages live in html/: resolve every relative URL from the site root. -->
    <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Astoria</title>
    <link rel="icon" type="image/x-icon" href="assets/images/ALICE_ACADEMIA.ico">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Same language as the home page (css/home.css): pills, 24px cards, logo. */
        .auth-body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 40px) 16px;
        }
        .auth-card {
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(136, 14, 79, 0.16);
            padding: 28px clamp(18px, 4vw, 32px) 22px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            border: 1px solid rgba(216, 27, 96, 0.16);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(255, 244, 248, 0.95));
            position: relative;
            overflow: hidden;
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
        }
        .auth-logo {
            display: block;
            width: 96px;
            height: auto;
            margin: 0 auto 6px;
            filter: drop-shadow(0 8px 18px rgba(136, 14, 79, 0.22));
        }
        .auth-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-primary);
            margin: 0 0 var(--space-2);
            text-align: center;
            letter-spacing: 0.08em;
        }
        .auth-subtitle {
            color: var(--color-gray-700);
            text-align: center;
            margin: 0 0 var(--space-8);
        }
        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            margin-bottom: var(--space-8);
            border-radius: 999px;
            background: var(--color-primary-lighter);
            border: 1px solid var(--color-primary-light);
        }
        .auth-tab {
            min-height: 40px;
            padding: 0 var(--space-6);
            border-radius: 999px;
            border: none;
            background: transparent;
            color: var(--color-primary-dark);
            font: inherit;
            font-weight: var(--font-semibold);
            cursor: pointer;
            transition: background-color var(--transition-fast), color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .auth-tab:hover {
            background: rgba(255, 255, 255, 0.6);
        }
        .auth-tab.active {
            background: var(--color-white);
            color: var(--color-primary);
            box-shadow: 0 3px 10px rgba(216, 27, 96, 0.16);
        }
        .auth-tab:focus-visible,
        .auth-link:focus-visible,
        .auth-button:focus-visible,
        .auth-reveal:focus-visible {
            outline: 3px solid rgba(216, 27, 96, 0.45);
            outline-offset: 2px;
        }
        .form-group {
            margin-bottom: var(--space-4);
        }
        .form-label {
            display: block;
            font-weight: var(--font-semibold);
            color: var(--color-gray-700);
            margin-bottom: var(--space-2);
        }
        .form-input {
            width: 100%;
            min-height: var(--touch-target-min);
            padding: 0 16px;
            border: 1px solid var(--color-primary-light);
            border-radius: 999px;
            font: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
            background: #fff;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(216, 27, 96, 0.15);
        }
        .auth-button {
            width: 100%;
            min-height: var(--touch-target-min);
            padding: 0 var(--space-8);
            background: linear-gradient(135deg, var(--color-primary-glow), var(--color-primary));
            color: white;
            border: 1px solid var(--color-primary);
            border-radius: 999px;
            font: inherit;
            font-size: 1rem;
            font-weight: var(--font-bold);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.15s ease, box-shadow 0.2s;
            box-shadow: var(--shadow-primary);
        }
        .auth-button:hover {
            background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
        }
        .auth-button:active {
            transform: translateY(1px);
        }
        .auth-button:disabled {
            background: var(--color-gray-400);
            border-color: var(--color-gray-400);
            cursor: not-allowed;
            box-shadow: none;
        }
        .error-message {
            background: #fee;
            color: #b3261e;
            padding: var(--space-5) var(--space-7);
            border-radius: 14px;
            margin-bottom: var(--space-4);
            display: none;
            border: 1px solid rgba(204, 51, 51, 0.25);
        }
        .error-message.visible {
            display: block;
        }
        .auth-footer {
            text-align: center;
            margin-top: var(--space-6);
            color: var(--color-gray-600);
            font-size: 0.875rem;
        }
        .session-notice {
            background: #eef6ff;
            color: #1e3a8a;
            padding: var(--space-5) var(--space-7);
            border-radius: 14px;
            margin-bottom: var(--space-4);
            border: 1px solid rgba(30, 58, 138, 0.2);
        }
        .session-notice-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-3);
            flex-wrap: wrap;
        }
        .session-notice-btn {
            flex: 1;
            padding: var(--space-2) var(--space-3);
            min-height: 40px;
            border-radius: 999px;
            border: 1px solid var(--color-primary);
            background: var(--color-primary);
            color: white;
            font: inherit;
            font-weight: var(--font-semibold);
            cursor: pointer;
        }
        .session-notice-btn.secondary {
            background: white;
            color: var(--color-primary);
        }
        .auth-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: var(--space-3);
            background: transparent;
            border: none;
            color: var(--color-primary);
            font: inherit;
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .password-field {
            position: relative;
        }
        .password-field .form-input {
            padding-right: 52px;
        }
        .auth-reveal {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            border: none;
            background: transparent;
            color: var(--color-primary-dark);
            font-size: 1.05rem;
            cursor: pointer;
        }
        .auth-reveal:hover {
            background: var(--color-primary-lighter);
        }
        .auth-reveal[aria-pressed="true"] {
            color: var(--color-primary);
        }
        @media (max-width: 520px) {
            .session-notice-actions {
                flex-direction: column;
            }
        }
    
        </style>
</head>
<body class="home-body auth-body">
    <header class="home-topbar">
        <a class="home-brand" href="./" data-route="publicHome" aria-label="Astoria, accueil">
            <img src="assets/images/alice_academia_logo.png" alt="" width="40" height="40">
            <span>Astoria</span>
        </a>
        <nav class="home-topnav" aria-label="Sections de l'accueil">
            <a href="./" data-route="publicHome" data-route-hash="royaumes">Royaumes</a>
            <a href="./" data-route="publicHome" data-route-hash="glossaire">Glossaire</a>
        </nav>
        <button type="button" class="home-menu-btn" id="publicNavToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="publicNav">☰</button>
    </header>
    <main class="auth-container">
        <div class="auth-card">
            <img class="auth-logo" src="assets/images/alice_academia_logo.png" alt="" width="96" height="96">
            <h1 class="auth-title">Astoria</h1>
            <p class="auth-subtitle" id="authSubtitle">Connectez-vous</p>
            <div class="auth-tabs" role="tablist" aria-label="Connexion ou inscription">
                <button type="button" class="auth-tab active tw-press" id="tabLogin" role="tab" aria-selected="true">Connexion</button>
                <button type="button" class="auth-tab tw-press" id="tabRegister" role="tab" aria-selected="false">Inscription</button>
            </div>
            <div id="errorMessage" class="error-message" role="alert"></div>
            <div id="sessionNotice" class="session-notice" hidden>
                <div id="sessionNoticeText"></div>
                <div class="session-notice-actions">
                    <button type="button" class="session-notice-btn tw-press" id="sessionContinue">Continuer</button>
                    <button type="button" class="session-notice-btn secondary tw-press" id="sessionLogout">Se déconnecter</button>
                </div>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername" class="form-label">Nom d'utilisateur</label>
                    <input type="text" id="loginUsername" class="form-input tw-input" required autocomplete="username" placeholder="Votre pseudo">
                </div>
                <div class="form-group">
                    <label for="loginPassword" class="form-label">Mot de passe</label>
                    <input type="password" id="loginPassword" class="form-input tw-input" required autocomplete="current-password" placeholder="Votre mot de passe">
                </div>
                <button type="button" class="auth-link tw-press" id="forgotPasswordLink">Mot de passe oublié ?</button>
                <button type="submit" class="auth-button tw-press" id="loginButton">Se connecter</button>
            </form>
            <form id="resetForm" style="display:none;">
                <div class="form-group">
                    <label for="resetUsername" class="form-label">Nom d'utilisateur</label>
                    <input type="text" id="resetUsername" class="form-input tw-input" required autocomplete="username" placeholder="Votre pseudo">
                </div>
                <div class="form-group">
                    <label for="resetPassword" class="form-label">Nouveau mot de passe</label>
                    <input type="password" id="resetPassword" class="form-input tw-input" required autocomplete="new-password" placeholder="Nouveau mot de passe">
                </div>
                <div class="form-group">
                    <label for="resetPasswordConfirm" class="form-label">Confirmer le mot de passe</label>
                    <input type="password" id="resetPasswordConfirm" class="form-input tw-input" required autocomplete="new-password" placeholder="Confirmer le mot de passe">
                </div>
                <button type="submit" class="auth-button tw-press" id="resetButton">Reinitialiser le mot de passe</button>
                <button type="button" class="auth-link tw-press" id="backToLoginLink">Retour à la connexion</button>
            </form>
            <form id="registerForm" style="display:none;">
                <div class="form-group">
                    <label for="registerUsername" class="form-label">Nom d'utilisateur</label>
                    <input type="text" id="registerUsername" class="form-input tw-input" required autocomplete="username" placeholder="Choisir un pseudo">
                </div>
                <div class="form-group">
                    <label for="registerPassword" class="form-label">Mot de passe</label>
                    <input type="password" id="registerPassword" class="form-input tw-input" required autocomplete="new-password" placeholder="Choisir un mot de passe">
                </div>
                <div class="form-group">
                    <label for="registerPasswordConfirm" class="form-label">Confirmer le mot de passe</label>
                    <input type="password" id="registerPasswordConfirm" class="form-input tw-input" required autocomplete="new-password" placeholder="Répéter le mot de passe">
                </div>
                <button type="submit" class="auth-button tw-press" id="registerButton">Créer le compte</button>
            </form>
            <div class="auth-footer">Astoria · Alice Academia</div>
        </div>
    </main>
    <script>
        // UI toggle (Connexion/Inscription) without relying on ES modules.
        (function () {
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const subtitle = document.getElementById('authSubtitle');
            const errorMessage = document.getElementById('errorMessage');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const resetForm = document.getElementById('resetForm');
            function hideError() {
                if (!errorMessage) return;
                errorMessage.textContent = '';
                errorMessage.classList.remove('visible');
            }
            function setMode(mode) {
                const isRegister = mode === 'register';
                tabLogin.classList.toggle('active', !isRegister);
                tabRegister.classList.toggle('active', isRegister);
                tabLogin.setAttribute('aria-selected', String(!isRegister));
                tabRegister.setAttribute('aria-selected', String(isRegister));
                loginForm.style.display = isRegister ? 'none' : 'block';
                registerForm.style.display = isRegister ? 'block' : 'none';
                if (resetForm) resetForm.style.display = 'none';
                subtitle.textContent = isRegister ? 'Créez votre compte' : 'Connectez-vous';
                hideError();
                try {
                    // Keep this page's path: with <base href="../"> a bare '#login' would point to the site root.
                    history.replaceState(null, '', window.location.pathname + window.location.search + (isRegister ? '#register' : '#login'));
                } catch {
                    // ignore
                }
                const focusTarget = document.getElementById(isRegister ? 'registerUsername' : 'loginUsername');
                if (focusTarget) focusTarget.focus();
            }
            tabLogin.addEventListener('click', () => setMode('login'));
            tabRegister.addEventListener('click', () => setMode('register'));
            // Show/hide toggle on every password field.
            document.querySelectorAll('input[type="password"]').forEach((input) => {
                const wrap = document.createElement('div');
                wrap.className = 'password-field';
                input.parentNode.insertBefore(wrap, input);
                wrap.appendChild(input);
                const reveal = document.createElement('button');
                reveal.type = 'button';
                reveal.className = 'auth-reveal';
                reveal.textContent = '👁';
                reveal.setAttribute('aria-label', 'Afficher le mot de passe');
                reveal.setAttribute('aria-pressed', 'false');
                reveal.addEventListener('click', () => {
                    const shown = input.type === 'password';
                    input.type = shown ? 'text' : 'password';
                    reveal.setAttribute('aria-pressed', String(shown));
                    reveal.setAttribute('aria-label', shown ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
                });
                wrap.appendChild(reveal);
            });
            window.astoriaAuthUI = { setMode, hideError };
            setMode(window.location.hash === '#register' ? 'register' : 'login');
        })();
    </script>
    <script type="module">
        import { login, register, resetUserPasswordPublic, isAuthenticated, logout, getCurrentUser } from './js/auth.js';
        const errorMessage = document.getElementById('errorMessage');
        const sessionNotice = document.getElementById('sessionNotice');
        const sessionNoticeText = document.getElementById('sessionNoticeText');
        const sessionContinue = document.getElementById('sessionContinue');
        const sessionLogout = document.getElementById('sessionLogout');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const resetForm = document.getElementById('resetForm');
        const loginButton = document.getElementById('loginButton');
        const registerButton = document.getElementById('registerButton');
        const resetButton = document.getElementById('resetButton');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const backToLoginLink = document.getElementById('backToLoginLink');
        if (isAuthenticated() && sessionNotice && sessionNoticeText && sessionContinue && sessionLogout) {
            const user = getCurrentUser();
            sessionNoticeText.textContent = user?.username
                ? `Déjà connecté en tant que ${user.username}.`
                : 'Déjà connecté.';
            sessionNotice.hidden = false;
            sessionContinue.addEventListener('click', () => {
                window.location.href = 'html/personnages.html';
            });
            sessionLogout.addEventListener('click', () => {
                logout();
                sessionNotice.hidden = true;
            });
        }
        function showError(message) {
            errorMessage.style.color = '';
            errorMessage.style.background = '';
            errorMessage.style.borderColor = '';
            errorMessage.textContent = message;
            errorMessage.classList.add('visible');
        }
        function showNotice(message) {
            errorMessage.style.color = '#166534';
            errorMessage.style.background = '#ecfdf3';
            errorMessage.style.borderColor = 'rgba(34, 197, 94, 0.35)';
            errorMessage.textContent = message;
            errorMessage.classList.add('visible');
        }
        function hideError() {
            if (window.astoriaAuthUI && window.astoriaAuthUI.hideError) {
                window.astoriaAuthUI.hideError();
                return;
            }
            errorMessage.textContent = '';
            errorMessage.style.color = '';
            errorMessage.style.background = '';
            errorMessage.style.borderColor = '';
            errorMessage.classList.remove('visible');
        }
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) {
                showError('Veuillez remplir tous les champs');
                return;
            }
            loginButton.disabled = true;
            loginButton.textContent = 'Connexion...';
            try {
                const result = await login(username, password);
                if (result.success) {
                    window.location.href = 'html/personnages.html';
                } else {
                    showError(result.error || 'Nom d\'utilisateur ou mot de passe incorrect');
                }
            } catch (err) {
                console.error(err);
                showError('Erreur de connexion. Veuillez réessayer.');
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = 'Se connecter';
            }
        });
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirm = document.getElementById('registerPasswordConfirm').value;
            if (!username || !password || !confirm) {
                showError('Veuillez remplir tous les champs');
                return;
            }
            if (password !== confirm) {
                showError('Les mots de passe ne correspondent pas');
                return;
            }
            registerButton.disabled = true;
            registerButton.textContent = 'Création...';
            try {
                const result = await register(username, password);
                if (result.success) {
                    window.location.href = 'html/personnages.html';
                } else {
                    showError(result.error || 'Impossible de créer le compte');
                }
            } catch (err) {
                console.error(err);
                showError('Impossible de créer le compte. Veuillez réessayer.');
            } finally {
                registerButton.disabled = false;
                registerButton.textContent = 'Créer le compte';
            }
        });
        if (forgotPasswordLink && resetForm) {
            forgotPasswordLink.addEventListener('click', () => {
                loginForm.style.display = 'none';
                registerForm.style.display = 'none';
                resetForm.style.display = 'block';
                if (window.astoriaAuthUI?.hideError) window.astoriaAuthUI.hideError();
                const subtitle = document.getElementById('authSubtitle');
                if (subtitle) subtitle.textContent = 'Reinitialiser le mot de passe';
            });
        }
        if (backToLoginLink && resetForm) {
            backToLoginLink.addEventListener('click', () => {
                resetForm.style.display = 'none';
                if (window.astoriaAuthUI?.setMode) {
                    window.astoriaAuthUI.setMode('login');
                } else {
                    loginForm.style.display = 'block';
                }
            });
        }
        if (resetForm) {
            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();
                const username = document.getElementById('resetUsername').value.trim();
                const password = document.getElementById('resetPassword').value;
                const confirm = document.getElementById('resetPasswordConfirm').value;
                if (!username || !password || !confirm) {
                    showError('Veuillez remplir tous les champs');
                    return;
                }
                if (password != confirm) {
                    showError('Les mots de passe ne correspondent pas');
                    return;
                }
                resetButton.disabled = true;
                resetButton.textContent = 'Reinitialisation...';
                try {
                    const result = await resetUserPasswordPublic(username, password);
                    if (result.success) {
                        resetForm.reset();
                        if (window.astoriaAuthUI?.setMode) {
                            window.astoriaAuthUI.setMode('login');
                        } else {
                            loginForm.style.display = 'block';
                        }
                        showNotice('Mot de passe mis a jour. Connectez-vous.');
                    } else {
                        showError(result.error || 'Impossible de reinitialiser le mot de passe');
                    }
                } catch (err) {
                    console.error(err);
                    showError('Erreur de reinitialisation. Veuillez reessayer.');
                } finally {
                    resetButton.disabled = false;
                    resetButton.textContent = 'Reinitialiser le mot de passe';
                }
            });
        }
    </script>
    <script>
        // ES modules (imports) do not work over file:// in most browsers.
        // Show a clear hint instead of a silent broken UI.
        (function () {
            if (window.location.protocol !== 'file:') return;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            const registerButton = document.getElementById('registerButton');
            if (errorMessage) {
                errorMessage.textContent = 'Ouvre cette page via un serveur local (Live Server) ou GitHub Pages.';
                errorMessage.classList.add('visible');
            }
            if (loginButton) loginButton.disabled = true;
            if (registerButton) registerButton.disabled = true;
        })();
    </script>
    <link rel="stylesheet" href="css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/body-scroll-lock@4.0.0-beta.0/lib/bodyScrollLock.min.js"></script>
    <script type="module" src="js/public/public-nav.js"></script>
</body>
</html>
