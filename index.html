<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astoria - Accueil</title>
    <meta name="description" content="Astoria : univers de jeu de rôle d'Alice Academia.">
    <link rel="icon" type="image/x-icon" href="assets/images/ALICE_ACADEMIA.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/home-viewer.css">
</head>
<body class="home-body">
    <main class="home-welcome" id="haut">
        <img class="home-welcome-logo" src="assets/images/alice_academia_logo.png" alt="Logo Alice Academia" width="180" height="180">
        <p class="home-kicker" id="homeKicker">Alice Academia</p>
        <h1 class="home-title" id="homeTitle">Astoria</h1>
        <p class="home-tagline" id="homeTagline"></p>

        <div class="home-choices">
            <button type="button" class="home-choice home-choice--primary" data-open-view="decouvrir">
                <span class="home-choice-title">Je découvre Astoria</span>
                <span class="home-choice-text">Une courte visite guidée</span>
            </button>
            <a class="home-choice" href="#" data-route="login" data-account-link data-account-card>
                <span class="home-choice-title" data-account-title>Je joue déjà</span>
                <span class="home-choice-text" data-account-text>Se connecter</span>
            </a>
        </div>

        <button type="button" class="home-link" data-open-view="glossaire">Ouvrir le glossaire</button>
    </main>

    <!-- Lecteur intégré : visite guidée et glossaire, sans quitter la page -->
    <div class="home-viewer" id="homeViewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
        <div class="home-viewer-panel">
            <header class="home-viewer-head">
                <p class="home-viewer-label" id="viewerLabel"></p>
                <button type="button" class="home-viewer-close" id="viewerClose" aria-label="Fermer et revenir à l'accueil">✕</button>
            </header>
            <div class="home-viewer-body" id="viewerBody" tabindex="-1">
                <h2 class="home-viewer-title" id="viewerTitle"></h2>
                <div id="viewerContent"></div>
            </div>
            <footer class="home-viewer-foot" id="viewerFoot"></footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/body-scroll-lock@4.0.0-beta.0/lib/bodyScrollLock.min.js"></script>
    <script type="module" src="js/public/home.js"></script>
</body>
</html>
